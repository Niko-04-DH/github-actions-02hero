#this is workflow name
name: hello 

# runs on trigger
on:
  push:
    branches: [main]
       
#these ar evjobs inside workflow
jobs:

#this is the name of the job
    greet:
      #this is github runner, each jobs runs on a runner
      runs-on: ubuntu-latest
      steps:
        - name: say hello to users continue-on-error
          run: echo "hello world" 

        - name: say hello to user name 
          run: echo "hello $USER"

    details:
      runs-on: ubuntu-latest
      steps:
        - name: version of python, docker, etc
          run: docker --version && python --version
    
