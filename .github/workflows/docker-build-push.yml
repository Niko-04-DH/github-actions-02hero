name: Docker build and push

on:
    push:
        branches: [main]
        
jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:

            - name: code checkout
              uses: actions/checkout@v4


            - name: Login to Docker build
              uses: docker/login-action@v3

              with:
                username: ${{ vars.DOCKERHUB_USER}}
                password: ${{ secrets.DOCKERHUB_TOKEN  }}

             
            - name: Build & Push to Docker hub
              uses: docker/build-push-action@v6 
              with:
                context: .
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USER }}/github-actions-app:${{ github.GITHUB_HEAD_REF}}
                    ${{ secrets.DOCKERHUB_USER }}/github-actions-app:latest
                    ${{ secrets.DOCKERHUB_USER }}/github-actions-app:${{ github.GITHUB_SHA}}

                    "NikoBellic/github-actions-app:latest"